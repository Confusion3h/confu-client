// Standalone launcher: plain Java 8, no dependencies (Swing/Java2D + JDK HTTP).
apply plugin: 'java'

sourceCompatibility = targetCompatibility = 1.8
compileJava.options.encoding = 'UTF-8'

version = rootProject.file('VERSION').text.trim()
archivesBaseName = 'CONFUSION3H-launcher'

jar {
    manifest.attributes('Main-Class': 'confusione.launcher.Main',
                        'Implementation-Title': 'Confu Client launcher',
                        'Implementation-Version': version)
}
