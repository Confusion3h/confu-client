plugins {
    id 'fabric-loom' version '1.5.8'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // NanoVG: same renderer the 1.8.9 client uses for its GUI (Minecraft 1.20.1 ships LWJGL 3.3.1 without it)
    implementation "org.lwjgl:lwjgl-nanovg:3.3.1"
    include "org.lwjgl:lwjgl-nanovg:3.3.1"
    // music player (1.8.9 decoders): MP3 and Ogg Vorbis, pure Java
    implementation "javazoom:jlayer:1.0.1"
    include "javazoom:jlayer:1.0.1"
    implementation "org.jcraft:jorbis:0.0.17"
    include "org.jcraft:jorbis:0.0.17"
    ["natives-linux", "natives-windows", "natives-macos", "natives-macos-arm64", "natives-windows-arm64", "natives-linux-arm64"].each { c ->
        runtimeOnly "org.lwjgl:lwjgl-nanovg:3.3.1:${c}"
        include "org.lwjgl:lwjgl-nanovg:3.3.1:${c}"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from('../LICENSE') {
        rename { "${it}_${project.archivesBaseName}" }
    }
}
